<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OUR LADY OF GRACE SENIOR HIGH SCHOOL — Student Personality of the Week (Administrator Portal)</title>
  <meta name="description" content="Official Student Personality of the Week Administrator Login Portal for Our Lady of Grace Senior High School (OLAG SHS).">
  
  <!-- Modern Google Fonts: Plus Jakarta Sans & Playfair Display for exact Serif Match -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Official School Favicon -->
  <link rel="icon" type="image/png" href="olag_logo.png">

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>

  <!-- Floating Dark/Light Mode Toggle -->
  <div style="position: fixed; top: 1.25rem; right: 1.25rem; z-index: 100;">
    <button type="button" class="header-theme-toggle btn-auth-theme-toggle" id="btnAuthThemeToggle" onclick="toggleAuthTheme()" title="Toggle Dark / Light Mode" style="background: rgba(12, 35, 64, 0.08); color: var(--navy-primary); border: 1px solid rgba(12, 35, 64, 0.15);">
      <span id="authThemeIcon">🌙</span>
      <span id="authThemeLabel" style="font-size: 0.78rem;">Dark Mode</span>
    </button>
  </div>

  <div id="screenLoginWrapper" class="login-split-container">
    <!-- LEFT HALF: Pristine White Minimalist Form matching screenshot -->
    <div class="auth-panel-form">
      <div class="auth-form-inner">

        <!-- Brand Logo at top -->
        <div class="auth-brand-header">
          <div class="auth-brand-logo-wrap">
            <img src="olag_logo.png" alt="Our Lady of Grace Senior High School Crest" />
          </div>
          <div class="auth-brand-text-wrap">
            <div class="auth-brand-name">OUR LADY OF GRACE</div>
            <div class="auth-brand-sub">SENIOR HIGH SCHOOL</div>
          </div>
        </div>

        <h1 class="auth-main-heading">Welcome back</h1>
        <p class="auth-sub-heading">Sign in with your administrator credentials to continue</p>

        <form id="loginFormAdmin" autocomplete="on" onsubmit="event.preventDefault(); signInAdmin(); return false;">
          <div class="auth-form-group">
            <label for="loginAdminUsername">Username</label>
            <div class="auth-input-container">
              <input 
                type="text" 
                id="loginAdminUsername" 
                class="auth-input-field admin-focus" 
                placeholder="Enter administrator username" 
                autocomplete="username" 
                required 
                onkeydown="if(event.key==='Enter'){event.preventDefault(); signInAdmin();}" 
              />
            </div>
          </div>

          <div class="auth-form-group">
            <label for="loginAdminPassword">Password</label>
            <div class="auth-input-container">
              <input 
                type="password" 
                id="loginAdminPassword" 
                class="auth-input-field admin-focus" 
                placeholder="Enter administrator password" 
                autocomplete="current-password" 
                required 
                onkeydown="if(event.key==='Enter'){event.preventDefault(); signInAdmin();}" 
              />
              <button type="button" id="btnToggleAdminPassword" class="auth-eye-btn" title="Toggle Password" aria-label="Toggle password visibility" onclick="if(window.app) window.app.togglePasswordVisibility('loginAdminPassword', 'btnToggleAdminPassword')">👁️</button>
            </div>
          </div>

          <button type="button" class="auth-submit-btn admin-navy-btn" id="btnLoginSubmitAdmin" onclick="signInAdmin()">
            <span>Sign in</span>
          </button>
        </form>

      </div>
    </div>

    <!-- RIGHT HALF: Atmospheric Royal Navy Gradient Showcase -->
    <div class="auth-panel-showcase admin-showcase">
      <div class="auth-showcase-inner">
        <h2 class="auth-showcase-title">Student Personality of the Week</h2>
        <p class="auth-showcase-desc">Official administration portal for student nominations, scoring rubrics, week intervals, and certificates at Our Lady of Grace Senior High School.</p>
      </div>
    </div>
  </div>

  <!-- Toast Notification Stack -->
  <div id="toastStack" class="toast-stack"></div>

  <!-- JavaScript Application Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=10"></script>
  <script>
    function updateAuthThemeUI(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const icon = document.getElementById('authThemeIcon');
      const label = document.getElementById('authThemeLabel');
      if (icon) icon.textContent = theme === 'dark' ? '☀️' : '🌙';
      if (label) label.textContent = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
    }

    function toggleAuthTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem('olag_theme', next);
      updateAuthThemeUI(next);
      if (window.app && window.app.store) {
        window.app.store.state.theme = next;
        window.app.store.save();
      }
    }

    // Apply saved theme immediately
    (function() {
      const savedTheme = localStorage.getItem('olag_theme') || 'light';
      updateAuthThemeUI(savedTheme);
    })();

    function signInAdmin() {
      if (window.app) {
        window.app.handleAdminLogin();
      } else {
        const userInp = document.getElementById('loginAdminUsername');
        const passInp = document.getElementById('loginAdminPassword');
        const username = userInp ? userInp.value.trim().toLowerCase() : '';
        const password = passInp ? passInp.value.trim() : '';

        if (!username) {
          alert('Please enter your administrator username.');
          if (userInp) userInp.focus();
          return;
        }
        if (!password) {
          alert('Please enter your administrator password.');
          if (passInp) passInp.focus();
          return;
        }
        if (username !== 'admin' || (password !== 'admin@26' && password !== 'admin' && password !== 'password')) {
          alert('Invalid administrator credentials. Please check your username and password.');
          return;
        }

        try {
          const storageKey = 'OLAG_SHS_SPOT_DATA_V7';
          let state = {};
          const saved = localStorage.getItem(storageKey);
          if (saved) state = JSON.parse(saved);
          state.isLoggedIn = true;
          state.currentRoleKey = 'admin';
          state.currentView = 'dashboard-admin';
          state.currentUser = {
            key: 'admin',
            name: 'Rev. Fr. Principal',
            title: 'School Administrator',
            roleTag: 'Administrator (Head)',
            avatar: 'AD',
            avatarBg: '#0c2340',
            dashboardView: 'dashboard-admin',
            description: 'Complete institutional oversight, assessment management, criteria control, and student records.'
          };
          localStorage.setItem(storageKey, JSON.stringify(state));
        } catch (e) {}
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
