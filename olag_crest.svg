<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffc107" />
      <stop offset="100%" stop-color="#b78103" />
    </linearGradient>
    <linearGradient id="crestNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103254" />
      <stop offset="100%" stop-color="#071828" />
    </linearGradient>
    <filter id="crestShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Shield Contour -->
  <path d="M 60 5 
           C 95 5, 115 15, 115 45 
           C 115 95, 85 125, 60 135 
           C 35 125, 5 95, 5 45 
           C 5 15, 25 5, 60 5 Z" 
        fill="url(#crestNavy)" 
        stroke="url(#crestGold)" 
        stroke-width="4" 
        filter="url(#crestShadow)" />

  <!-- Inner Shield Border -->
  <path d="M 60 12 
           C 90 12, 107 20, 107 46 
           C 107 90, 80 117, 60 126 
           C 40 117, 13 90, 13 46 
           C 13 20, 30 12, 60 12 Z" 
        fill="none" 
        stroke="url(#crestGold)" 
        stroke-width="1.5" 
        stroke-dasharray="3,2" />

  <!-- Radiance Rays Behind Cross -->
  <g stroke="url(#crestGold)" stroke-width="1.2" opacity="0.75">
    <line x1="60" y1="52" x2="35" y2="30" />
    <line x1="60" y1="52" x2="85" y2="30" />
    <line x1="60" y1="52" x2="30" y2="52" />
    <line x1="60" y1="52" x2="90" y2="52" />
    <line x1="60" y1="52" x2="38" y2="74" />
    <line x1="60" y1="52" x2="82" y2="74" />
  </g>

  <!-- Central Golden Cross -->
  <path d="M 54 22 H 66 V 46 H 88 V 58 H 66 V 96 H 54 V 58 H 32 V 46 H 54 Z" 
        fill="url(#crestGold)" 
        stroke="#fff" 
        stroke-width="0.8" />

  <!-- Open Book of Wisdom at Bottom of Cross -->
  <path d="M 60 92 
           C 50 86, 38 88, 30 92 
           V 112 
           C 38 108, 50 106, 60 112 
           C 70 106, 82 108, 90 112 
           V 92 
           C 82 88, 70 86, 60 92 Z" 
        fill="#ffffff" 
        stroke="url(#crestGold)" 
        stroke-width="1.5" />
  <line x1="60" y1="92" x2="60" y2="112" stroke="url(#crestNavy)" stroke-width="1.5" />

  <!-- Stars of Excellence -->
  <polygon points="60,18 62,23 67,23 63,26 65,31 60,28 55,31 57,26 53,23 58,23" fill="#ffffff" />
  <polygon points="26,38 27.5,41.5 31,41.5 28,43.5 29.5,47 26,45 22.5,47 24,43.5 21,41.5 24.5,41.5" fill="url(#crestGold)" />
  <polygon points="94,38 95.5,41.5 99,41.5 96,43.5 97.5,47 94,45 90.5,47 92,43.5 89,41.5 92.5,41.5" fill="url(#crestGold)" />
</svg>
